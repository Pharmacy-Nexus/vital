<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#040505" />
  <meta name="color-scheme" content="dark" />
  <title>VITAL ID — Cinematic 3D NFC</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="app">
    <!-- Static poster is deliberately underneath the WebGL canvas.
         It gives you a useful preview if the CDN is offline; JS fades it
         out once Three.js has rendered the real scene. -->
    <div class="fallback-poster" aria-hidden="true">
      <div class="poster-glow poster-glow-a"></div>
      <div class="poster-glow poster-glow-b"></div>
      <img class="poster-card" src="./assets/card-front.png" alt="" />
      <div class="poster-phone">
        <img src="./assets/emergency-screen.png" alt="" />
      </div>
      <div class="poster-brand">
        <img src="./assets/logo-white.png" alt="" />
        <span>SMART EMERGENCY ACCESS · NFC + QR</span>
      </div>
    </div>

    <div id="webgl"></div>

    <div class="hud" aria-hidden="true">
      <div class="intro-copy">
        <span class="eyebrow">VITAL ID</span>
        <h1>Medical information.<br><em>In reach.</em></h1>
        <p>NFC + QR emergency access.</p>
      </div>

      <div class="tap-copy">
        <span class="tap-dot"></span>
        <span>NFC TAP</span>
      </div>

      <div class="screen-copy">
        <span>EMERGENCY PROFILE</span>
        <strong>Critical information<br>available in seconds.</strong>
      </div>

      <div class="final-copy">
        <img src="./assets/logo-white.png" alt="VITAL ID" />
        <p>A QUICKER WAY TO CARE</p>
        <i></i>
        <strong>Tap. Access. Help faster.</strong>
      </div>
    </div>

    <div class="ui">
      <button id="replay" type="button" title="Replay">↻</button>
      <button id="pause" type="button" title="Pause / play">Ⅱ</button>
    </div>

    <div id="loading" class="loading">
      <span></span>
      <small>LOADING VITAL ID</small>
    </div>
  </main>

  <script>
    // Fail-safe: if the CDN is unavailable, reveal the static poster instead
    // of leaving a loading screen over the page.
    window.setTimeout(() => document.getElementById("loading")?.classList.add("hide"), 2600);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
